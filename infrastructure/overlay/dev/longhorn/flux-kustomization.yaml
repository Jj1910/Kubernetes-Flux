apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-longhorn-system
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-longhorn-repo
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: infrastructure/base/longhorn
  prune: true
  wait: true
  namePrefix: dev-flux-
  patches:
  - target:
      kind: HelmRelease
      name: longhorn-release
    patch: |-
      - op: replace
        path: /spec/chart/spec
        value: v1.12.0

      - op: add
        path: /spec/values
        value: 
          defaultSettings:
            defaultDataPath: /var/mnt/longhorn
            #deletingConfirmationFlag: "true"
          service:
            ui:
              type: NodePort
              nodePort: 30004
          persistence:
            reclaimPolicy: Retain
