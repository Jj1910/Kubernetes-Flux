apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-prometheus-stack-ingress
  namespace: monitoring-system
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host("grafana.kube.justinschoenfeld.com")
    kind: Rule
    services:
    - name: dev-flux-kube-prometheus-stack-release-grafana
      port: 80
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-kube-prometheus-stack-system
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-kube-prometheus-stack-repo
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: infrastructure/base/kube-prometheus-stack
  prune: true
  wait: true
  namePrefix: dev-flux-
  patches:
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack-release
    patch: |-
      - op: replace
        path: /spec/chart/spec/version
        value: 88.2.0

      - op: add
        path: /spec/values
        value: 
          grafana:
            adminUser: demo
            adminPassword: demopass
            #service:
            #  type: NodePort
            #  nodePort: 30005
            #  type: LoadBalancer