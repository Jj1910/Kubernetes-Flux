apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack-repo
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: infrastructure/base/kube-prometheus-stack
  prune: true
  wait: true
  namePrefix: dev-flux-
  patches:
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: add
        path: /spec/values
        value: 
          grafana:
            adminUser: demo
            adminPassword: demopass
            service:
              type: NodePort
              nodePort: 30005