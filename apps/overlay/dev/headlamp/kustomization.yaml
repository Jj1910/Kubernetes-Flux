apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/headlamp

namePrefix: dev-
#kind: HelmRepository
#metadata:
#  name: dev-headlamp
#  namespace: kube-system

patches:
  - target:
      kind: HelmRepository
      name: headlamp
    patch: |-
      - op: replace
        path: /name
        value: headlamp
