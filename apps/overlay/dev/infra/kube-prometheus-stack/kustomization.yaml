apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/infra/kube-prometheus-stack

namePrefix: dev-

patches:
  -target:
    kind: HelmRelease
    name: kube-prometheus-stack
   patch: |-
   - op: add
     path: /spec/values/grafana
     value:
      adminUser: demo
      adminPassword: demopass