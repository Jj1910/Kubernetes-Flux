apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-system
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/base/infra/longhorn-repo
  prune: true
  wait: true
  namePrefix: dev-
  patches:
  - target:
      kind: HelmRelease
      name: longhorn-release
    patch: |-
      - op: add
        path: /spec/values
        value: 
          defaultSettings:
            defaultDataPath: /var/mnt/longhorn
            deletingConfirmationFlag: "true"
          service:
            ui:
              type: NodePort
              nodePort: 30004
          persistence:
            reclaimPolicy: Retain
  - target:
      kind: Namespace
      name: longhorn-system
    patch: |-
      - op: add
        path: /metadata
        value:
          name: longhorn-system
          labels:
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/warn: privileged