apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1m0s
  chart:
    spec:
      chart: prometheus
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus
        namespace: monitoring
  values:
    grafana:
      adminPassword: grafana
      persistence:
        enabled: true
        storageClassName: local-path
        size: 5Gi
      service:
        type: NodePort
        nodePort: 30080
    
    prometheus:
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
      service:
        type: NodePort
        nodePort: 30090
    
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
      service:
        type: NodePort
        nodePort: 30093
    
    nodeExporter:
      enabled: true
    
    kubeStateMetrics:
      enabled: true
