apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: v1.12.0
  interval: 1m0s
  values:
    defaultSettings:
      v1DataEngine: false
      v2DataEngine: true
      createDefaultDiskLabeledNodes: true
    persistence:
      dataEngine: v2
